# CI/CD pipeline TEMPLATE (§R12.12). This workflow is a declared seam for Stage 20 — it encodes the
# intended pipeline (format -> static -> tests -> build -> migration-check -> deploy) but real execution,
# build, and deploy are Runtime Verification Pending (RV-18). Deploy jobs are gated/manual and perform
# nothing here. This file changes no application code.

name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  static-and-tests:
    name: format / static / tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check (mypy --strict)
        run: python -m mypy
      - name: Unit / offline tests
        run: python -m pytest -q

  integration:
    name: integration (gated, RUN_INTEGRATION=1) — RV
    runs-on: ubuntu-latest
    needs: static-and-tests
    if: ${{ false }} # enabled on staging with live PostgreSQL + Redis (RV-7/RV-9)
    env:
      RUN_INTEGRATION: "1"
    steps:
      - run: echo "RV: requires live PostgreSQL + Redis services"

  build-and-migration-check:
    name: build image + migration check — RV
    runs-on: ubuntu-latest
    needs: static-and-tests
    if: ${{ false }} # RV-1 (docker build) / RV-4 (alembic upgrade head on a throwaway DB)
    steps:
      - run: echo "RV: docker build + alembic upgrade head"

  deploy:
    name: deploy (gated / manual) — RV
    runs-on: ubuntu-latest
    needs: build-and-migration-check
    if: ${{ false }} # deploy only after all checks pass; performs nothing in this stage (RV-18)
    steps:
      - run: echo "RV: deploy is manual/gated; no real deployment in Stage 20"
