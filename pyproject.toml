# Project manifest — AI Telegram Automation Platform (MASTER_SPEC v2.0).
# Stage 1 (§R13.1): repository structure + toolchain only. Runtime dependencies are
# declared here as the project's dependency manifest (§R1.3); they are imported by code
# only from the stage that introduces them. No future-stage logic is implemented yet.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-ai-platform"
version = "0.1.0"
description = "Production-ready AI platform that autonomously runs Telegram channels."
readme = "README.md"
requires-python = ">=3.13"          # §R1.3 (Python 3.13+); dev venv is 3.14, which satisfies this floor.

# Runtime stack (§R1.3). Declared now; installed/used incrementally per implementation stage.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",             # business-config file format (§R3.4)
    "sqlalchemy>=2",
    "alembic",
    "asyncpg",
    "pgvector",
    "redis>=5",           # async client for cache + distributed rate-limiter (§R7.6/§R8.9)
    "aiogram>=3",         # Bot API; v3 is the async API MASTER_SPEC assumes (§R7.1)
    "aiohttp",            # §R1.3 stack (also transitive via aiogram)
    "anthropic",
    "openai",
    "pillow",
    "uuid6",              # UUIDv7 primary keys (§R4.3); works on Python 3.13+ (owner decision)
]
# UUIDv7 provider (§R4.3) is added at Stage 6 (ORM PKs), not here: stdlib uuid.uuid7() exists only
# on Python 3.14, but the floor is 3.13; the 3.13-vs-3.14 / backport choice may warrant an ADR
# (Architecture Freeze). Exact version pinning + uv.lock is delivered at §R12.13 (DevOps), not now.

# Dev tooling via PEP 735 dependency-groups (not shipped in wheel metadata — correct for dev tools).
[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "types-PyYAML",       # mypy stubs for pyyaml
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ------------------------------------------------------------------------------------
# Ruff — format + lint (§R12.12 step 1-2)
# ------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100                    # §R3.6 keeps files/functions small; 100 is the hard wrap.
target-version = "py313"
src = ["app", "tests"]
extend-exclude = ["legacy"]          # archived prior build (§ archived per owner decision)

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort (import ordering; supports dependency-direction hygiene §R3.1)
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "TID",           # tidy imports
    "RUF",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ------------------------------------------------------------------------------------
# Mypy — strict typing (§R3.6, §R12.12 step 2)
# ------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_reexport = true
files = ["app", "tests"]
# Alembic migration scripts use dynamically-typed `alembic.context`/`op`; not strict-typed.
exclude = ["app/db/migrations/"]

# ------------------------------------------------------------------------------------
# Pytest (§R3.9, §R12.12 step 3) — unit always; integration gated by RUN_INTEGRATION=1
# ------------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: touches DB/network; run only when RUN_INTEGRATION=1 (§R3.9, TEST_PLAN)",
]
addopts = "-ra"
